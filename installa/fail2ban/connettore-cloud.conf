# fail2ban - filtro del Connettore cloud. Da copiare in /etc/fail2ban/filter.d/connettore-cloud.conf
# Il connettore scrive nel journal, per ogni codice sbagliato o indirizzo inesistente:
#   {"connettore": {"rifiutato": "1.2.3.4", "percorso": "..."}}
[Definition]
failregex = ^.*"rifiutato": "<HOST>"
ignoreregex =
